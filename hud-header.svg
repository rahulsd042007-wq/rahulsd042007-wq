<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#0a3a52" stroke-width="0.5"/></pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020b14"/><stop offset="1" stop-color="#05213a"/></linearGradient>
    <radialGradient id="core"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#7df9ff"/><stop offset="1" stop-color="#00b8d4" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="320" rx="14" fill="url(#bg)"/>
  <rect width="900" height="320" rx="14" fill="url(#grid)"/>

  <g fill="none" stroke="#F5C242" stroke-width="3" stroke-linecap="round">
    <path d="M20 52V20H52"/><path d="M848 20H880V52"/><path d="M20 268V300H52"/><path d="M848 300H880V268"/>
  </g>

  <g filter="url(#glow)" fill="none">
    <circle cx="150" cy="160" r="104" stroke="#00E5FF" stroke-width="2" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0 150 160" to="360 150 160" dur="24s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="160" r="84" stroke="#F5C242" stroke-width="3" stroke-dasharray="44 14">
      <animateTransform attributeName="transform" type="rotate" from="360 150 160" to="0 150 160" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="160" r="64" stroke="#00E5FF" stroke-width="4" stroke-dasharray="90 18 20 18">
      <animateTransform attributeName="transform" type="rotate" from="0 150 160" to="360 150 160" dur="9s" repeatCount="indefinite"/></circle>
    <g stroke="#7df9ff" stroke-width="7" stroke-linecap="round">
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(0 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(36 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(72 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(108 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(144 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(180 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(216 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(252 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(288 150 160)"/>
      <line x1="150" y1="118" x2="150" y2="134" transform="rotate(324 150 160)"/>
    </g>
    <circle cx="150" cy="160" r="26" fill="url(#core)" stroke="none">
      <animate attributeName="r" values="22;29;22" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <text x="300" y="140" font-family="'Courier New',monospace" font-weight="700" font-size="62" fill="#E8FBFF" filter="url(#glow)">RAHUL S D</text>
  <text x="302" y="182" font-family="'Courier New',monospace" font-weight="700" font-size="17" letter-spacing="2.5" fill="#F5C242">ELECTRONICS &amp; COMMUNICATION ENGINEERING</text>
  <text x="302" y="212" font-family="'Courier New',monospace" font-size="14" letter-spacing="2" fill="#00E5FF">IoT // EMBEDDED SYSTEMS // ESP32 // ARDUINO</text>

  <circle cx="308" cy="262" r="5" fill="#00E5FF"><animate attributeName="opacity" values="1;0.15;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="324" y="267" font-family="'Courier New',monospace" font-size="13" letter-spacing="1.5" fill="#7df9ff">J.A.R.V.I.S. PROFILE ONLINE // ALL SYSTEMS NOMINAL</text>

  <circle cx="835" cy="90" r="22" fill="none" stroke="#E62429" stroke-width="2.5" stroke-dasharray="5 7" filter="url(#glow)">
    <animateTransform attributeName="transform" type="rotate" from="0 835 90" to="360 835 90" dur="6s" repeatCount="indefinite"/></circle>

  <rect x="0" y="0" width="900" height="2" fill="#00E5FF" opacity="0.35">
    <animate attributeName="y" from="0" to="320" dur="4s" repeatCount="indefinite"/></rect>
</svg>
