<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Minion and electronic gadgets popping animation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: 'Courier New', monospace; }
      .pop { transform-box: fill-box; transform-origin: center; animation: pop 6s infinite both; }
      @keyframes pop {
        0%, 4%   { transform: scale(0); }
        10%      { transform: scale(1.25); }
        14%, 86% { transform: scale(1); }
        92%, 100%{ transform: scale(0); }
      }
      .d1 { animation-delay: .3s; }
      .d2 { animation-delay: .6s; }
      .d3 { animation-delay: .9s; }
      .d4 { animation-delay: 1.2s; }
      .d5 { animation-delay: 1.5s; }
      .d6 { animation-delay: 1.8s; }
      .d7 { animation-delay: 1.1s; }

      .minion { animation: rise 6s infinite both; }
      @keyframes rise {
        0%, 2%   { transform: translateY(170px); }
        10%      { transform: translateY(-14px); }
        14%, 86% { transform: translateY(0); }
        94%, 100%{ transform: translateY(170px); }
      }
      .wave { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 0.7s infinite alternate ease-in-out; }
      @keyframes wave { from { transform: rotate(-25deg); } to { transform: rotate(20deg); } }
      .look { animation: look 3s infinite ease-in-out; }
      @keyframes look { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }

      .glow { animation: glow 1s infinite alternate ease-in-out; }
      @keyframes glow { from { opacity: .15; } to { opacity: .9; } }
      .w1 { animation: wifi 1.2s infinite; opacity: .2; }
      .w2 { animation: wifi 1.2s infinite .25s; opacity: .2; }
      .w3 { animation: wifi 1.2s infinite .5s; opacity: .2; }
      @keyframes wifi { 0%, 100% { opacity: .15; } 50% { opacity: 1; } }

      .trace { stroke-dasharray: 8 10; animation: dash 1s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -18; } }
      .blink { animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .tw { animation: tw 2.4s infinite ease-in-out; }
      @keyframes tw { 0%, 100% { opacity: .1; } 50% { opacity: 1; } }
    </style>
    <clipPath id="clipMin"><rect x="0" y="0" width="900" height="250"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="898" height="258" rx="12" fill="#020b14" stroke="#00E5FF" stroke-opacity=".4"/>
  <g stroke="#00E5FF" stroke-opacity=".07">
    <path d="M0 50H900M0 100H900M0 150H900M0 200H900"/>
    <path d="M100 0V260M200 0V260M300 0V260M400 0V260M500 0V260M600 0V260M700 0V260M800 0V260"/>
  </g>
  <text x="20" y="30" fill="#00E5FF" font-size="13">&gt; SYSTEM ONLINE<tspan class="blink">_</tspan></text>

  <!-- sparkles -->
  <circle class="tw" cx="60" cy="70" r="2" fill="#F5C242"/>
  <circle class="tw" cx="380" cy="55" r="2" fill="#00E5FF" style="animation-delay:.8s"/>
  <circle class="tw" cx="560" cy="110" r="2" fill="#F5C242" style="animation-delay:1.4s"/>
  <circle class="tw" cx="860" cy="60" r="2" fill="#00E5FF" style="animation-delay:.4s"/>
  <circle class="tw" cx="250" cy="90" r="2" fill="#F5C242" style="animation-delay:1.9s"/>

  <!-- circuit trace + ground -->
  <path class="trace" d="M20 222H880" stroke="#00E5FF" stroke-opacity=".6" stroke-width="2" fill="none"/>
  <path d="M0 250H900" stroke="#F5C242" stroke-width="3"/>

  <!-- ===== GADGETS (left) ===== -->
  <!-- 1. MCU chip -->
  <g transform="translate(70,140)">
    <g class="pop d1">
      <g stroke="#F5C242" stroke-width="3">
        <path d="M-12 -30V-22M0 -30V-22M12 -30V-22M-12 22V30M0 22V30M12 22V30M-30 -12H-22M-30 0H-22M-30 12H-22M22 -12H30M22 0H30M22 12H30"/>
      </g>
      <rect x="-22" y="-22" width="44" height="44" rx="5" fill="#0a1f2e" stroke="#00E5FF" stroke-width="2"/>
      <rect x="-11" y="-11" width="22" height="22" rx="2" fill="none" stroke="#F5C242"/>
      <text x="0" y="4" text-anchor="middle" font-size="9" fill="#F5C242">MCU</text>
      <text x="0" y="48" text-anchor="middle" font-size="10" fill="#9fefff">CHIP</text>
    </g>
  </g>

  <!-- 2. ESP32 -->
  <g transform="translate(175,140)">
    <g class="pop d2">
      <rect x="-34" y="-20" width="68" height="40" rx="4" fill="#0a1f2e" stroke="#00E5FF" stroke-width="2"/>
      <rect x="-10" y="-14" width="30" height="22" rx="2" fill="#9fefff" opacity=".85"/>
      <path d="M-34 -10H-40L-36 -4L-42 2L-36 8" fill="none" stroke="#F5C242" stroke-width="2"/>
      <g fill="#F5C242">
        <circle cx="-22" cy="-16" r="1.8"/><circle cx="-12" cy="-16" r="1.8"/><circle cx="22" cy="-16" r="1.8"/><circle cx="30" cy="-16" r="1.8"/>
        <circle cx="-22" cy="16" r="1.8"/><circle cx="-12" cy="16" r="1.8"/><circle cx="22" cy="16" r="1.8"/><circle cx="30" cy="16" r="1.8"/>
      </g>
      <text x="5" y="0" text-anchor="middle" font-size="8" fill="#020b14" font-weight="700">ESP32</text>
      <text x="0" y="48" text-anchor="middle" font-size="10" fill="#9fefff">ESP32</text>
    </g>
  </g>

  <!-- 3. LED -->
  <g transform="translate(285,140)">
    <g class="pop d3">
      <circle class="glow" cx="0" cy="-6" r="26" fill="#E62429"/>
      <path d="M-12 8V-8A12 12 0 0 1 12 -8V8Z" fill="#E62429" stroke="#ff8a8e" stroke-width="2"/>
      <rect x="-15" y="8" width="30" height="5" fill="#ff8a8e"/>
      <path d="M-5 13V30M5 13V24" stroke="#F5C242" stroke-width="2"/>
      <text x="0" y="48" text-anchor="middle" font-size="10" fill="#9fefff">LED</text>
    </g>
  </g>

  <!-- ===== MINION ===== -->
  <g clip-path="url(#clipMin)">
    <g transform="translate(450,250)">
      <g class="minion">
        <!-- hair -->
        <path d="M-8 -150V-166M0 -150V-170M8 -150V-166" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
        <!-- arms -->
        <path d="M-45 -58L-66 -34" stroke="#F5C242" stroke-width="9" stroke-linecap="round"/>
        <circle cx="-67" cy="-33" r="6" fill="#222"/>
        <!-- body -->
        <rect x="-45" y="-150" width="90" height="150" rx="45" fill="#F5C242"/>
        <!-- overalls -->
        <path d="M-45 -65H45V-45A45 45 0 0 1 -45 -45Z" fill="#2F5FA8"/>
        <rect x="-45" y="-74" width="16" height="12" fill="#2F5FA8"/>
        <rect x="29" y="-74" width="16" height="12" fill="#2F5FA8"/>
        <rect x="-16" y="-58" width="32" height="22" rx="4" fill="#24497f"/>
        <circle cx="-34" cy="-68" r="2.5" fill="#F5C242"/>
        <circle cx="34" cy="-68" r="2.5" fill="#F5C242"/>
        <!-- goggle strap -->
        <rect x="-45" y="-112" width="90" height="10" fill="#333"/>
        <!-- goggles -->
        <circle cx="-18" cy="-107" r="19" fill="#c9c9c9" stroke="#555" stroke-width="5"/>
        <circle cx="18" cy="-107" r="19" fill="#c9c9c9" stroke="#555" stroke-width="5"/>
        <circle cx="-18" cy="-107" r="13" fill="#fff"/>
        <circle cx="18" cy="-107" r="13" fill="#fff"/>
        <g class="look">
          <circle cx="-18" cy="-107" r="6" fill="#6b4423"/><circle cx="-18" cy="-107" r="3" fill="#000"/>
          <circle cx="18" cy="-107" r="6" fill="#6b4423"/><circle cx="18" cy="-107" r="3" fill="#000"/>
        </g>
        <!-- mouth -->
        <path d="M-14 -80Q0 -66 14 -80" fill="none" stroke="#5a3a1a" stroke-width="3" stroke-linecap="round"/>
        <!-- waving arm -->
        <g transform="translate(45,-58)">
          <g class="wave">
            <path d="M0 0L24 -26" stroke="#F5C242" stroke-width="9" stroke-linecap="round"/>
            <circle cx="25" cy="-27" r="6" fill="#222"/>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- speech bubble -->
  <g transform="translate(535,28)">
    <g class="pop d7">
      <path d="M0 34L-14 52L22 34Z" fill="#020b14" stroke="#F5C242" stroke-width="2" stroke-linejoin="round"/>
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#020b14" stroke="#F5C242" stroke-width="2"/>
      <rect x="-2" y="30" width="26" height="6" fill="#020b14"/>
      <text x="65" y="22" text-anchor="middle" font-size="13" fill="#F5C242" font-weight="700">BANANA!</text>
    </g>
  </g>

  <!-- ===== GADGETS (right) ===== -->
  <!-- 4. Ultrasonic sensor -->
  <g transform="translate(620,140)">
    <g class="pop d4">
      <rect x="-36" y="-20" width="72" height="40" rx="4" fill="#0a1f2e" stroke="#00E5FF" stroke-width="2"/>
      <circle cx="-17" cy="0" r="12" fill="#111" stroke="#9fefff" stroke-width="2"/>
      <circle cx="17" cy="0" r="12" fill="#111" stroke="#9fefff" stroke-width="2"/>
      <circle cx="-17" cy="0" r="5" fill="none" stroke="#F5C242"/>
      <circle cx="17" cy="0" r="5" fill="none" stroke="#F5C242"/>
      <path d="M-12 20V28M-4 20V28M4 20V28M12 20V28" stroke="#F5C242" stroke-width="2"/>
      <text x="0" y="48" text-anchor="middle" font-size="10" fill="#9fefff">HC-SR04</text>
    </g>
  </g>

  <!-- 5. WiFi -->
  <g transform="translate(725,140)">
    <g class="pop d5">
      <g fill="none" stroke="#F5C242" stroke-width="4" stroke-linecap="round">
        <path class="w3" d="M-21.2 2.8A30 30 0 0 1 21.2 2.8"/>
        <path class="w2" d="M-14.1 9.9A20 20 0 0 1 14.1 9.9"/>
        <path class="w1" d="M-7.1 16.9A10 10 0 0 1 7.1 16.9"/>
      </g>
      <circle cx="0" cy="24" r="4" fill="#F5C242"/>
      <text x="0" y="48" text-anchor="middle" font-size="10" fill="#9fefff">WI-FI</text>
    </g>
  </g>

  <!-- 6. Battery -->
  <g transform="translate(830,140)">
    <g class="pop d6">
      <rect x="-30" y="-16" width="56" height="32" rx="5" fill="#0a1f2e" stroke="#00E5FF" stroke-width="2"/>
      <rect x="26" y="-7" width="6" height="14" rx="2" fill="#00E5FF"/>
      <path d="M2 -12L-10 2H-2L-4 12L8 -2H0Z" fill="#F5C242"/>
      <text x="0" y="48" text-anchor="middle" font-size="10" fill="#9fefff">LiPo</text>
    </g>
  </g>
</svg>
